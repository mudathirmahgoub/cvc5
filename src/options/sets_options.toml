id     = "SETS"
name   = "Sets Theory"

[[option]]
  name       = "setsProxyLemmas"
  category   = "expert"
  long       = "sets-proxy-lemmas"
  type       = "bool"
  default    = "false"
  help       = "introduce proxy variables eagerly to shorten lemmas"

[[option]]
  name       = "setsExp"
  category   = "expert"
  long       = "sets-exp"
  type       = "bool"
  default    = "false"
  help       = "enable extended symbols such as complement and universe in theory of sets"

[[option]]
  name       = "relsFunctionalMode"
  category   = "expert"
  long       = "rels-functional-mode=MODE"
  type       = "RelsFunctionalMode"
  default    = "UF"
  help       = "how the relations solver reasons about asserted (rel.is-functional R) constraints"
  help_mode  = "Modes for reasoning about functional relations."
[[option.mode.UF]]
  name = "uf"
  help = "Introduce a fresh function f for R and infer y = f(x) for every member (x, y) of R. Falls back to pairs if the logic has no uninterpreted functions."
[[option.mode.PAIRS]]
  name = "pairs"
  help = "For every two members (x1, y1) and (x2, y2) of R, infer x1 = x2 => y1 = y2."

[[option]]
  name       = "relsExp"
  category   = "expert"
  long       = "rels-exp"
  type       = "bool"
  default    = "true"
  help       = "enable the relations extension of the theory of sets"

[[option]]
  name       = "setsCardExp"
  category   = "expert"
  long       = "sets-card-exp"
  type       = "bool"
  default    = "true"
  help       = "enable the cardinality extension of the theory of sets"

[[option]]
  name       = "relsAcyclicHammer"
  category   = "expert"
  long       = "rels-acyclic-hammer"
  type       = "bool"
  default    = "false"
  help       = "disable the TCLOSURE_UP and JOIN_SPLIT relational lemmas"

[[option]]
  name       = "relsAcyclicAnchor"
  category   = "expert"
  long       = "rels-acyclic-anchor=MODE"
  type       = "RelsAcyclicAnchorMode"
  default    = "BRANCH"
  help       = "how the cycle witness of a (rel.cyclic R) constraint is anchored with the asserted acyclicity constraints (not (rel.cyclic S))"
  help_mode  = "Anchoring modes for relation-acyclicity cycle witnesses."
[[option.mode.NONE]]
  name = "none"
  help = "No anchoring."
[[option.mode.BRANCH]]
  name = "branch"
  help = "For every asserted (not (rel.cyclic S)), once the candidate model fixes the length of the witness (at last call), one of the edges of the witness is not in TC(S)."
[[option.mode.INCLUSION]]
  name = "inclusion"
  help = "For every asserted (not (rel.cyclic S)), introduce an edge of the cyclic relation that is not in TC(S). May introduce fresh elements and slow down finite model finding."
[[option.mode.BOTH]]
  name = "both"
  help = "Branch and inclusion."

[[option]]
  name       = "relsTcSubset"
  category   = "expert"
  long       = "rels-tc-subset"
  type       = "bool"
  default    = "false"
  help       = "closure induction: from (a,b) in (rel.tclosure R) infer (a,b) in S for every transitive superset S of R, where S is a product A x B or a closure or iden that R is asserted to be a subset of, a relation T with R subset T and T;T subset T asserted (in particular R itself when R is transitive), J;J^T with (rel.is-functional J) asserted, or (rel.tclosure X) when R is syntactically included in it"

[[option]]
  name       = "relsTcDownLazy"
  category   = "expert"
  long       = "rels-tc-down-lazy"
  type       = "bool"
  default    = "false"
  help       = "apply the TCLOSURE_DOWN case split, which introduces fresh elements, only at last-call effort for closure memberships that the known members of the base relation do not explain, instead of at every full-effort check"

[[option]]
  name       = "relsAcyclicBackwardChords"
  category   = "expert"
  long       = "rels-acyclic-backward-chords"
  type       = "bool"
  default    = "false"
  help       = "in the minimality rule of the cycle witness of a (rel.cyclic R) constraint, also forbid backward chords, i.e. closure edges from a later to an earlier element of the witness; sound, and needed by unsat proofs that rely on a totality axiom over one of the relations, but it slows down finite model finding"
