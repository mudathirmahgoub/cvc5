id     = "SETS"
name   = "Sets Theory"

[[option]]
  name       = "setsProxyLemmas"
  category   = "expert"
  long       = "sets-proxy-lemmas"
  type       = "bool"
  default    = "false"
  help       = "introduce proxy variables eagerly to shorten lemmas"

[[option]]
  name       = "setsExp"
  category   = "expert"
  long       = "sets-exp"
  type       = "bool"
  default    = "false"
  help       = "enable extended symbols such as complement and universe in theory of sets"

[[option]]
  name       = "relsFunctionalMode"
  category   = "expert"
  long       = "rels-functional-mode=MODE"
  type       = "RelsFunctionalMode"
  default    = "UF"
  help       = "how the relations solver reasons about asserted (rel.is-functional R) constraints"
  help_mode  = "Modes for reasoning about functional relations."
[[option.mode.UF]]
  name = "uf"
  help = "Infer y = f(x) for every member (x, y) of R, with f a fresh function. Linear in the members of R; pairs is used if the logic has no uninterpreted functions."
[[option.mode.PAIRS]]
  name = "pairs"
  help = "Infer x1 = x2 => y1 = y2 for every two members (x1, y1) and (x2, y2) of R. Quadratic in the members of R."

[[option]]
  name       = "relsExp"
  category   = "expert"
  long       = "rels-exp"
  type       = "bool"
  default    = "true"
  help       = "enable the relations extension of the theory of sets"

[[option]]
  name       = "setsCardExp"
  category   = "expert"
  long       = "sets-card-exp"
  type       = "bool"
  default    = "true"
  help       = "enable the cardinality extension of the theory of sets"

[[option]]
  name       = "relsAcyclicHammer"
  category   = "expert"
  long       = "rels-acyclic-hammer"
  type       = "bool"
  default    = "false"
  help       = "do not split closure and join memberships into fresh elements (the TCLOSURE_DOWN and JOIN_SPLIT lemmas); instead, check at last call that every such membership is explained by known members, e.g. (a,c) in TC(R) by (a,b) and (b,c) in R; meant for unsat problems"

[[option]]
  name       = "relsAcyclicAnchor"
  category   = "expert"
  long       = "rels-acyclic-anchor=MODE"
  type       = "RelsAcyclicAnchorMode"
  default    = "BRANCH"
  help       = "how the cycle witness of (rel.cyclic R) is constrained by each asserted (not (rel.cyclic S)): some edge of the cycle is not in TC(S)"
  help_mode  = "Anchoring modes for relation-acyclicity cycle witnesses."
[[option.mode.NONE]]
  name = "none"
  help = "No anchoring."
[[option.mode.BRANCH]]
  name = "branch"
  help = "At last call, when the candidate model fixes the length N of the witness s1 -> ... -> sN = s1: one of the edges (s1,s2), ..., (s(N-1),sN) is not in TC(S)."
[[option.mode.INCLUSION]]
  name = "inclusion"
  help = "A fresh pair t with t in R and t not in TC(S). May slow down finite model finding."
[[option.mode.BOTH]]
  name = "both"
  help = "Branch and inclusion."

[[option]]
  name       = "relsTcSubset"
  category   = "expert"
  long       = "rels-tc-subset"
  type       = "bool"
  default    = "false"
  help       = "closure induction: from (a,b) in TC(R), R subset S and S transitive, infer (a,b) in S; e.g. R subset (rel.product A B) gives (a,b) in A x B, and a transitive R gives (a,b) in R"

[[option]]
  name       = "relsTcDownLazy"
  category   = "expert"
  long       = "rels-tc-down-lazy"
  type       = "bool"
  default    = "false"
  help       = "split a closure membership (a,b) in TC(R) into fresh elements (TCLOSURE_DOWN) only at last call, and only if the known members of R do not explain it"

[[option]]
  name       = "relsCycleDefUnion"
  category   = "expert"
  long       = "rels-cycle-def-union"
  type       = "bool"
  default    = "false"
  help       = "(prototype) for (rel.cyclic R) with R a union, also assert (s1, s1) in TC(R)"

[[option]]
  name       = "relsCycleUnrollGuard"
  category   = "expert"
  long       = "rels-cycle-unroll-guard"
  type       = "bool"
  default    = "false"
  help       = "(prototype) at full effort, do not unroll a cycle witness s1..s_c when c < l is false in the current assignment"

[[option]]
  name       = "relsCycleLenDecide"
  category   = "expert"
  long       = "rels-cycle-len-decide"
  type       = "bool"
  default    = "false"
  help       = "(prototype) decide the length l of every cycle witness from small to large (l <= 2, l <= 3, ...)"

[[option]]
  name       = "relsCycleKeepPrefix"
  category   = "expert"
  long       = "rels-cycle-keep-prefix"
  type       = "bool"
  default    = "false"
  help       = "(prototype) when a cycle witness is created again after backtracking, start from the longest prefix unrolled so far (its lemmas are permanent) instead of from s1"

[[option]]
  name       = "relsCycleFlattenTop"
  category   = "expert"
  long       = "rels-cycle-flatten-top"
  type       = "bool"
  default    = "false"
  help       = "(prototype) the cycle witness of (rel.cyclic (set.union A B)) uses the two operands A and B, without flattening nested unions"

[[option]]
  name       = "relsProductLazy"
  category   = "expert"
  long       = "rels-product-lazy"
  type       = "bool"
  default    = "false"
  help       = "(prototype, for unsat problems) do not compose the members of products; a model with an incomplete product is reported unsound (unknown)"

[[option]]
  name       = "relsTcUpSkipKnown"
  category   = "expert"
  long       = "rels-tc-up-skip-known"
  type       = "bool"
  default    = "false"
  help       = "(prototype) TCLOSURE_UP and the join/product composition send no lemma for a tuple that is already a member"

[[option]]
  name       = "relsCycleFlattenKeepTc"
  category   = "expert"
  long       = "rels-cycle-flatten-keep-tc"
  type       = "bool"
  default    = "false"
  help       = "(prototype) when flattening the union of a cycle witness, keep a nested union X as one operand if (rel.tclosure X) is a term"

[[option]]
  name       = "relsTcSubsetSplit"
  category   = "expert"
  long       = "rels-tc-subset-split"
  type       = "bool"
  default    = "false"
  help       = "(prototype) for a closure TC(X;Y), decide (true first) the atom X;Y subset X (X transitive) or X;Y subset TC(X), so that closure induction applies"

[[option]]
  name       = "relsProductLazyCompose"
  category   = "expert"
  long       = "rels-product-lazy-compose"
  type       = "bool"
  default    = "false"
  help       = "(prototype) with --rels-product-lazy, compose the missing members of products at last call instead of reporting the model unsound"

[[option]]
  name       = "relsAcyclicBackwardChords"
  category   = "expert"
  long       = "rels-acyclic-backward-chords"
  type       = "bool"
  default    = "false"
  help       = "in the cycle witness of (rel.cyclic R), also exclude backward edges that close a shorter cycle, e.g. (s3,s2) in the witness s1 -> s2 -> s3 -> s1; helps unsat proofs that use a totality axiom, slows down finite model finding"
